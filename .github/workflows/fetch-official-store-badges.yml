name: Fetch official store badges

on:
  push:
    paths:
      - '.github/workflows/fetch-official-store-badges.yml'

permissions:
  contents: write

jobs:
  fetch-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official badge artwork
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --output assets/app-store-badge-de.svg 'https://apple-resources.s3.amazonaws.com/media-badges/download-on-the-app-store/black/de-de.svg'
          curl --fail --location --retry 3 --output assets/app-store-badge-en.svg 'https://apple-resources.s3.amazonaws.com/media-badges/download-on-the-app-store/black/en-us.svg'
          curl --fail --location --retry 3 --output assets/google-play-badge-de.png 'https://play.google.com/intl/en_us/badges/static/images/badges/de_badge_web_generic.png'
          curl --fail --location --retry 3 --output assets/google-play-badge-en.png 'https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png'
          grep -q '<svg' assets/app-store-badge-de.svg
          grep -q '<svg' assets/app-store-badge-en.svg
          test "$(wc -c < assets/google-play-badge-de.png)" -gt 1000
          test "$(wc -c < assets/google-play-badge-en.png)" -gt 1000
      - name: Commit badge artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app-store-badge-de.svg assets/app-store-badge-en.svg assets/google-play-badge-de.png assets/google-play-badge-en.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add official App Store and Google Play badges'
            git push
          fi
